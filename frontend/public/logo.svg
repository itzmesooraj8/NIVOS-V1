<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090e1a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Cyan Pillars Gradient -->
    <linearGradient id="cyanPillars" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Cyan Diagonal Gradient -->
    <linearGradient id="cyanDiagonal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="45%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <!-- Subtle Cyan Outer Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Depth Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background Rounded Square (Dark Slate/Obsidian) -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" filter="url(#cardShadow)" />

  <!-- Subtle Neon Rim Accent -->
  <rect x="28" y="28" width="456" height="456" rx="100" ry="100" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- N Monogram (Vibrant Cyan) -->
  <g filter="url(#cyanGlow)">
    <!-- Diagonal Slash (rendered behind vertical pillars for depth) -->
    <line x1="158" y1="148" x2="354" y2="364" stroke="url(#cyanDiagonal)" stroke-width="58" stroke-linecap="round" />

    <!-- Left Vertical Pillar -->
    <line x1="158" y1="148" x2="158" y2="364" stroke="url(#cyanPillars)" stroke-width="58" stroke-linecap="round" />

    <!-- Right Vertical Pillar -->
    <line x1="354" y1="148" x2="354" y2="364" stroke="url(#cyanPillars)" stroke-width="58" stroke-linecap="round" />

    <!-- Center Futuristic Core Spark -->
    <circle cx="256" cy="256" r="10" fill="#e0f2fe" opacity="0.95" />
    <polygon points="256,236 268,256 256,276 244,256" fill="#a5f3fc" opacity="0.8" />
  </g>
</svg>
